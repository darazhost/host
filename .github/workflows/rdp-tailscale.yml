name: Tailscale RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Check Tailscale
        run: |
          tailscale status
          tailscale ip

      - name: Test RDP connection
        env:
          RDP_HOST: ${{ secrets.RDP_HOST }}
        run: |
          echo "Testing RDP connection to $RDP_HOST"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$RDP_HOST/3389" \
            && echo "RDP port 3389 is reachable" \
            || echo "RDP port 3389 is NOT reachable"

      - name: Check Tailscale connectivity
        env:
          RDP_HOST: ${{ secrets.RDP_HOST }}
        run: |
          ping -c 3 "$RDP_HOST" || true
