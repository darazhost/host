name: Tailscale RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    name: Connect to RDP through Tailscale
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Show Tailscale status
        run: |
          echo "=== Tailscale Status ==="
          tailscale status

          echo ""
          echo "=== Tailscale IP ==="
          tailscale ip

      - name: Test Tailscale connection
        env:
          RDP_HOST: ${{ secrets.RDP_HOST }}
        run: |
          echo "Testing connection to: $RDP_HOST"

          tailscale ping "$RDP_HOST" --c 3

      - name: Test RDP port
        env:
          RDP_HOST: ${{ secrets.RDP_HOST }}
          RDP_PORT: ${{ secrets.RDP_PORT }}
        run: |
          echo "Testing RDP port $RDP_PORT on $RDP_HOST"

          if timeout 10 bash -c "</dev/tcp/$RDP_HOST/$RDP_PORT"; then
            echo "RDP port $RDP_PORT is OPEN"
          else
            echo "RDP port $RDP_PORT is NOT reachable"
            exit 1
          fi

      - name: RDP connection successful
        run: |
          echo "======================================"
          echo "Tailscale connection: SUCCESS"
          echo "RDP port connection: SUCCESS"
          echo "======================================"
